<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 简历管家 - 智能简历生成器</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #root { height: 100%; width: 100%; }
  </style>
  <script>
    function injectReactHooks() {
      if (typeof React !== 'undefined' && React.useState) {
        window.useState = React.useState;
        window.useEffect = React.useEffect;
        window.useRef = React.useRef;
        window.useCallback = React.useCallback;
        window.useMemo = React.useMemo;
        window.useContext = React.useContext;
        window.useReducer = React.useReducer;
        window.useLayoutEffect = React.useLayoutEffect;
      } else {
        setTimeout(injectReactHooks, 100);
      }
    }
    injectReactHooks();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="react">

// ================= 全局 UI 辅助组件 =================
const InputGroup = ({ label, value, onChange, grid = false, type = 'text', placeholder, readOnly = false }) => (
  <div className={`mb-3 ${grid ? '' : 'w-full'}`}>
    <label className="block text-[12px] font-bold text-gray-500 mb-1">{label}</label>
    <input type={type} value={value} onChange={onChange} placeholder={placeholder} readOnly={readOnly}
      className={`w-full px-3 py-2 bg-gray-50/50 border border-gray-200 rounded-lg text-sm text-gray-800 focus:bg-white focus:ring-2 focus:ring-indigo-100 focus:border-indigo-500 outline-none transition-all ${readOnly ? 'opacity-70 cursor-not-allowed' : ''}`} />
  </div>
);

const TextAreaGroup = ({ label, value, onChange, placeholder, rows = 3 }) => (
  <div className="mb-3 w-full">
    <label className="block text-[12px] font-bold text-gray-500 mb-1">{label}</label>
    <textarea rows={rows} value={value} onChange={onChange} placeholder={placeholder} 
      className="w-full px-3 py-2 bg-gray-50/50 border border-gray-200 rounded-lg text-sm text-gray-800 focus:bg-white focus:ring-2 focus:ring-indigo-100 focus:border-indigo-500 outline-none transition-all custom-scrollbar" />
  </div>
);

function App() {
  // ================= 状态管理：简历业务数据 =================
  const [basic, setBasic] = useState({ name: '张云帆', gender: '男', age: '25岁', phone: '138-0000-0000', email: 'zhangyunfan@example.com', experience: '3年经验', degree: '本科' });
  const [avatar, setAvatar] = useState(null);
  const [intention, setIntention] = useState({ role: '高级产品经理', city: '北京 / 深圳', status: '随时到岗' });
  const [selfEval, setSelfEval] = useState({ content: '具备3年互联网产品经验，主导过多款千万级APP的从0到1孵化。精通Axure、Figma等原型工具，对数据敏感，擅长通过数据分析驱动产品迭代。具备优秀的跨部门沟通能力与抗压能力，能高效推动项目落地。', isOptimizing: false });
  const [education, setEducation] = useState([{ id: 1, school: '华南理工大学', major: '计算机科学与技术', degree: '本科', date: '2017.09 - 2021.06' }]);
  const [skills, setSkills] = useState("• 熟练掌握产品规划与设计，能独立完成市场调研、竞品分析及PRD文档撰写。\n• 精通 Axure、Figma、Xmind 等工具。\n• 熟悉敏捷开发流程，具备项目管理能力。\n• 掌握基本的 Python 与 SQL 数据分析。");
  const [experiences, setExperiences] = useState([{ id: 1, company: '星辰科技有限公司', role: '产品经理', date: '2021.07 - 至今', desc: '• 核心主导：作为核心产品经理，主导从0到1孵化千万级社交APP，负责市场调研、需求挖掘及完整产品架构设计。\n• AI赋能：创新性地引入AI智能推荐算法，重构用户匹配链路，上线后使日均活跃用户数(DAU)提升35%，次日留存率提升20%。\n• 敏捷迭代：建立并推进敏捷研发流程，跨部门协同20+人团队，将版本迭代周期缩短至双周，极大提升交付效率。', isOptimizing: false }]);
  const [projects, setProjects] = useState([{ id: 1, name: 'OfferGo 简历大模型', role: '项目负责人', date: '2023.08 - 2023.11', desc: '• 项目统筹：从0到1独立负责「OfferGo简历」的完整生命周期，统筹需求分析、原型设计及技术选型。\n• 体验优化：创新性引入大模型API实现一键STAR法则润色，产品上线首月即获取数万名自然流量用户。\n• 商业变现：设计“基础免费+广告植入”商业闭环，上线次周即实现规模化营收。', isOptimizing: false }]);

  // ================= 状态管理：JD 匹配 & VIP权限 =================
  const [jdText, setJdText] = useState('');
  const [matchReport, setMatchReport] = useState(null);
  const [isMatching, setIsMatching] = useState(false);
  
  const [isVip, setIsVip] = useState(false);
  const [showPaywall, setShowPaywall] = useState(false);

  // ================= 状态管理：UI与渲染引擎 =================
  const [activeTab, setActiveTab] = useState('content');
  const [templateType, setTemplateType] = useState('modern');
  const [themeColor, setThemeColor] = useState('#4f46e5'); 
  const [fontFamily, setFontFamily] = useState('theme-font-sans'); 
  const [isExporting, setIsExporting] = useState(false);
  const [isPdfLoaded, setIsPdfLoaded] = useState(false);

  // 动态加载 html2pdf 库
  useEffect(() => {
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';
    script.async = true;
    script.onload = () => setIsPdfLoaded(true);
    document.body.appendChild(script);
    return () => { if (document.body.contains(script)) document.body.removeChild(script); };
  }, []);

  useEffect(() => {
    const style = document.createElement('style');
    style.innerHTML = `
      @media print {
        body { background-color: white !important; margin: 0; padding: 0; }
        .no-print { display: none !important; }
        .resume-container { box-shadow: none !important; margin: 0 !important; width: 100% !important; max-width: 100% !important; }
        * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        .page-break-inside-avoid { page-break-inside: avoid; break-inside: avoid; }
        @page { margin: 0; size: A4 portrait; }
      }
      .theme-font-sans { font-family: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif !important; }
      .theme-font-serif { font-family: 'SimSun', 'Songti SC', 'Noto Serif SC', serif !important; }
      .theme-font-kai { font-family: 'KaiTi', 'Kaiti SC', 'STKaiti', serif !important; }
      .custom-scrollbar::-webkit-scrollbar { width: 6px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
      @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
      .animate-slideUp { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      .animate-fadeIn { animation: fadeIn 0.2s ease-out forwards; }
    `;
    document.head.appendChild(style);
    return () => { if (document.head.contains(style)) document.head.removeChild(style); };
  }, []);

  // ================= 核心：后端联调引擎 =================
  const callAI = async (prompt, expectJson = false) => {
    const BACKEND_URL = 'https://amendment-images-sullivan-roller.trycloudflare.com/api/chat'; 
    for (let i = 0; i < 3; i++) {
      try {
        const res = await fetch(BACKEND_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: prompt, expectJson: expectJson })
        });
        const resultData = await res.json();
        if (!resultData.success) throw new Error(resultData.error || '后端中转服务处理失败');
        return resultData.data;
      } catch (err) {
        if (i === 2) { 
          alert(err.message || '无法连接到后端服务器，请检查您的 Node.js 服务是否在运行。');
          if(expectJson) return null; 
          throw err; 
        }
        await new Promise(r => setTimeout(r, 1000 * Math.pow(2, i)));
      }
    }
  };

  // ================= UI 交互与路由逻辑 (已完全修复 ReferenceError) =================
  const handleTabSwitch = (tabId) => {
    if (tabId === 'match' && !isVip) {
      setShowPaywall(true);
      return;
    }
    setActiveTab(tabId);
  };

  const handleTemplateSelect = (tplId) => {
    if ((tplId === 'elite' || tplId === 'creative') && !isVip) {
      setShowPaywall(true);
      return;
    }
    setTemplateType(tplId);
  };

  const handleMockPayment = () => {
    setTimeout(() => {
      setIsVip(true);
      setShowPaywall(false);
      alert('🎉 支付成功！已为您解锁所有高级功能。');
    }, 800);
  };

  // ================= 状态更新辅助 =================
  const updateList = (setList, id, field, value) => setList(prev => prev.map(item => item.id === id ? { ...item, [field]: value } : item));
  const handleAddItem = (type) => {
    if (type === 'work') setExperiences(prev => [...prev, { id: Date.now(), company: '', role: '', date: '', desc: '', isOptimizing: false }]);
    if (type === 'project') setProjects(prev => [...prev, { id: Date.now(), name: '', role: '', date: '', desc: '', isOptimizing: false }]);
    if (type === 'edu') setEducation(prev => [...prev, { id: Date.now(), school: '', major: '', degree: '', date: '' }]);
  };
  const handleRemoveItem = (id, type) => {
    if (type === 'work') setExperiences(prev => prev.filter(e => e.id !== id));
    if (type === 'project') setProjects(prev => prev.filter(p => p.id !== id));
    if (type === 'edu') setEducation(prev => prev.filter(e => e.id !== id));
  };
  const handleAvatarUpload = (e) => {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onloadend = () => setAvatar(reader.result);
      reader.readAsDataURL(file);
    }
  };
  const removeAvatar = () => setAvatar(null);

  // ================= 业务逻辑：AI 操作 =================
  const handleJDMatch = async () => {
    if (!jdText.trim()) return alert('请先粘贴岗位要求 (JD)');
    setIsMatching(true); setMatchReport(null);
    const resumeContext = `目标岗位: ${intention.role}\n技能: ${skills}\n自我评价: ${selfEval.content}\n工作经历: ${experiences.map(e => e.desc).join('\n')}\n项目经历: ${projects.map(p => p.desc).join('\n')}`;
    const prompt = `请根据以下【岗位要求(JD)】和【候选人简历】，进行客观精准的匹配度打分和分析。\n【JD】：${jdText}\n【简历】：${resumeContext}\n请严格返回 JSON 格式数据：{"score": 85, "analysis": "50字内简明总结", "matched_keywords": ["产品规划", "数据分析"], "missing_keywords": ["团队管理", "英语"], "advice": ["建议1", "建议2"]}`;
    const report = await callAI(prompt, true);
    if (report) setMatchReport(report); 
    setIsMatching(false);
  };

  const handleRewriteEvalByJD = async () => {
    if (!jdText.trim()) return alert('缺少 JD 信息');
    setSelfEval(prev => ({ ...prev, isOptimizing: true }));
    const allExp = [...experiences.map(e => e.desc), ...projects.map(p => p.desc)].filter(Boolean).join('\n');
    const prompt = `【岗位 JD】：${jdText}\n【经历汇总】：${allExp}\n根据JD，提取经历亮点重写自我评价。150字内，迎合JD痛点，专业自信，绝不输出废话，直接给出纯文本。`;
    try {
      const result = await callAI(prompt);
      if(result) { setSelfEval({ content: result.trim(), isOptimizing: false }); setActiveTab('content'); }
    } catch (e) { setSelfEval(prev => ({ ...prev, isOptimizing: false })); }
  };

  const handleGenerateSelfEval = async () => {
    setSelfEval(prev => ({ ...prev, isOptimizing: true }));
    const allWork = experiences.map(e => `${e.role}: ${e.desc}`).join('；');
    const allProj = projects.map(e => `${e.name}: ${e.desc}`).join('；');
    const prompt = `目标岗位：${intention.role}。\n经验学历：${basic.experience}，${basic.degree}。\n技能：${skills}\n工作汇总：${allWork}\n项目汇总：${allProj}\n请撰写一段不超过150字的“自我评价/个人总结”，提炼最核心竞争力。语气自信专业，浑然一体。直接输出纯文本。`;
    try {
      const result = await callAI(prompt);
      if(result) setSelfEval({ content: result.trim(), isOptimizing: false });
    } catch (err) { setSelfEval(prev => ({ ...prev, isOptimizing: false })); }
  };

  const handleOptimizeBlock = async (id, type) => {
    const isWork = type === 'work';
    const list = isWork ? experiences : projects;
    const setList = isWork ? setExperiences : setProjects;
    const target = list.find(e => e.id === id);
    if (!target || !target.desc.trim()) return;

    setList(prev => prev.map(item => item.id === id ? { ...item, isOptimizing: true } : item));

    const jdContext = jdText.trim() ? `请特别注意向这个JD靠拢提炼经验:\n【JD内容】\n${jdText}\n` : '';
    const orgName = isWork ? target.company : target.name;
    const prompt = `目标岗位：${intention.role}。\n${jdContext}\n以下是该用户在【${orgName}】担任【${target.role}】时的经历：\n"${target.desc}"\n\n请用 STAR 法则重写。语言精炼专业，必须量化结果(可虚构数据占位如"XX%")。分2-4小点，每点"• "开头。绝不输出解释性废话，直接给出纯文本。`;
    
    try {
      const result = await callAI(prompt);
      if(result) { setList(prev => prev.map(item => item.id === id ? { ...item, desc: result.trim(), isOptimizing: false } : item)); }
    } catch (err) { setList(prev => prev.map(item => item.id === id ? { ...item, isOptimizing: false } : item)); }
  };

  const handleExportRealPDF = async () => {
    if (!isPdfLoaded || typeof window.html2pdf === 'undefined') return alert('PDF引擎加载中...');
    setIsExporting(true);
    const element = document.getElementById('resume-pdf-container');
    const opt = {
      margin: 0, filename: `${basic.name}_简历_OfferGo.pdf`, image: { type: 'jpeg', quality: 1 },
      html2canvas: { scale: 2, useCORS: true, letterRendering: true, backgroundColor: '#ffffff' },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
      pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }
    };
    try { await window.html2pdf().set(opt).from(element).save(); } catch (error) { alert('导出失败'); } finally { setIsExporting(false); }
  };

  // ================= 渲染简历模板体系 =================
  const renderClassicTemplate = () => (
    <div className={`p-[15mm] bg-white w-full min-h-[297mm] ${fontFamily} text-gray-900`}>
      <div className="border-b-[2px] pb-[4mm] mb-[6mm] border-gray-800 page-break-inside-avoid flex justify-between items-end">
        <div className={`flex-1 ${avatar ? 'text-left' : 'text-center'}`}>
          <h1 className="text-[36px] font-black tracking-widest mb-3" style={{ color: themeColor }}>{basic.name}</h1>
          <div className="text-[14px] font-bold mb-2 tracking-wide">求职意向：{intention.role}</div>
          <div className={`text-[13px] text-gray-700 flex flex-wrap gap-4 ${avatar ? 'justify-start' : 'justify-center'}`}>
            <span>{basic.gender} | {basic.age}</span><span>{basic.phone}</span><span>{basic.email}</span><span>{basic.degree} | {basic.experience}</span>
          </div>
        </div>
        {avatar && <div className="ml-4 flex-shrink-0"><img src={avatar} alt="Avatar" className="w-[24mm] h-[33mm] object-cover border border-gray-300 shadow-sm rounded-sm" /></div>}
      </div>
      {(() => {
        const Title = ({text}) => (<div className="mb-[4mm] mt-[6mm] border-b border-gray-400 pb-1 flex items-center gap-2 page-break-inside-avoid"><div className="w-1.5 h-4" style={{ backgroundColor: themeColor }}></div><h2 className="text-[16px] font-black tracking-widest uppercase" style={{ color: themeColor }}>{text}</h2></div>);
        return (
          <>
            {selfEval.content && (<div className="page-break-inside-avoid mb-[4mm]"><Title text="个人优势" /><p className="text-[13.5px] leading-[1.8] text-gray-800 text-justify whitespace-pre-line m-0">{selfEval.content}</p></div>)}
            {education.length > 0 && (<div className="page-break-inside-avoid mb-[4mm]"><Title text="教育背景" />{education.map(edu => (<div key={edu.id} className="flex justify-between items-center mb-1 text-[13.5px] text-gray-800"><div className="font-bold w-1/3">{edu.school}</div><div className="w-1/3 text-center">{edu.major} ({edu.degree})</div><div className="w-1/3 text-right text-gray-600 font-mono">{edu.date}</div></div>))}</div>)}
            {skills && (<div className="page-break-inside-avoid mb-[4mm]"><Title text="专业技能" /><div className="text-[13.5px] leading-[1.8] text-gray-800 whitespace-pre-line">{skills}</div></div>)}
            {experiences.length > 0 && (<div className="mb-[4mm]"><Title text="工作经历" /><div className="space-y-[4mm]">{experiences.map(exp => (<div key={exp.id} className="page-break-inside-avoid"><div className="flex justify-between items-center text-[14px] font-bold text-gray-900 mb-1"><div>{exp.company} <span className="font-normal text-gray-600 ml-2">| {exp.role}</span></div><div className="font-normal text-gray-600 text-[13px] font-mono">{exp.date}</div></div><div className="text-[13.5px] leading-[1.8] text-gray-800 text-justify whitespace-pre-line">{exp.desc}</div></div>))}</div></div>)}
            {projects.length > 0 && (<div className="mb-[4mm]"><Title text="项目经历" /><div className="space-y-[4mm]">{projects.map(proj => (<div key={proj.id} className="page-break-inside-avoid"><div className="flex justify-between items-center text-[14px] font-bold text-gray-900 mb-1"><div>{proj.name} <span className="font-normal text-gray-600 ml-2">| {proj.role}</span></div><div className="font-normal text-gray-600 text-[13px] font-mono">{proj.date}</div></div><div className="text-[13.5px] leading-[1.8] text-gray-800 text-justify whitespace-pre-line">{proj.desc}</div></div>))}</div></div>)}
          </>
        )
      })()}
    </div>
  );

  const renderModernTemplate = () => (
    <div className={`flex flex-row w-full bg-white min-h-[297mm] ${fontFamily}`}>
      <div className="w-[33%] bg-[#f8fafc] border-r border-gray-200 p-[8mm] flex flex-col pt-[12mm]">
        <div className="mb-[6mm] page-break-inside-avoid text-center">
          {avatar && <div className="mb-4 flex justify-center"><img src={avatar} alt="Avatar" className="w-[28mm] h-[28mm] object-cover rounded-full shadow-md border-2 border-white" /></div>}
          <h1 className="text-[26px] font-black tracking-widest mb-1" style={{ color: themeColor }}>{basic.name}</h1>
          <div className="text-[13px] font-bold text-gray-700 tracking-wider mb-2 bg-gray-200/50 inline-block px-2 py-0.5 rounded">{intention.role}</div>
        </div>
        {(() => {
          const LeftTitle = ({title}) => (<div className={`flex items-center gap-2 mb-3 mt-5 page-break-inside-avoid`}><div className="h-[14px] w-[4px] rounded-sm" style={{ backgroundColor: themeColor }}></div><h2 className="text-[14px] font-black tracking-widest text-gray-800">{title}</h2></div>);
          return (
            <>
              <LeftTitle title="联系方式" />
              <div className="text-[12px] space-y-2 text-gray-600 font-medium tracking-wide page-break-inside-avoid"><div className="flex items-center gap-1.5"><span className="text-gray-400">📞</span>{basic.phone}</div><div className="flex items-center gap-1.5 break-all"><span className="text-gray-400">✉️</span>{basic.email}</div><div className="flex items-center gap-1.5"><span className="text-gray-400">👤</span>{basic.gender} | {basic.age}</div><div className="flex items-center gap-1.5"><span className="text-gray-400">🎓</span>{basic.degree} | {basic.experience}</div><div className="flex items-center gap-1.5"><span className="text-gray-400">📍</span>{intention.city}</div></div>
              <LeftTitle title="教育背景" />
              <div className="space-y-3 page-break-inside-avoid">{education.map(edu => (<div key={edu.id}><div className="font-bold text-[13px] text-gray-800 mb-0.5">{edu.school}</div><div className="text-[12px] text-gray-600">{edu.major} ({edu.degree})</div><div className="text-[11px] text-gray-400 mt-0.5 font-mono">{edu.date}</div></div>))}</div>
              <LeftTitle title="专业技能" />
              <div className="text-[12px] leading-[1.7] text-gray-600 whitespace-pre-line page-break-inside-avoid">{skills}</div>
            </>
          )
        })()}
      </div>
      <div className="w-[67%] p-[10mm] pt-[12mm]">
        {(() => {
          const RightTitle = ({title}) => (<div className={`flex items-center gap-2 mb-4 mt-6 page-break-inside-avoid`}><div className="h-[20px] w-[5px] rounded-sm" style={{ backgroundColor: themeColor }}></div><h2 className="text-[18px] font-black tracking-widest" style={{ color: themeColor }}>{title}</h2><div className="flex-1 border-b-[1.5px] border-gray-100 mt-1 ml-2"></div></div>);
          return (
            <>
              {selfEval.content && (<div className="mb-[6mm] page-break-inside-avoid"><RightTitle title="个人优势总结" /><p className="text-[13.5px] leading-[1.8] text-gray-700 text-justify whitespace-pre-line m-0">{selfEval.content}</p></div>)}

                      <div className="grid grid-cols-2 gap-3 mb-2">
                        <InputGroup label="公司" value={exp.company} onChange={e => updateList(setExperiences, exp.id, 'company', e.target.value)} grid />
                        <InputGroup label="岗位" value={exp.role} onChange={e => updateList(setExperiences, exp.id, 'role', e.target.value)} grid />
                      </div>
                      <InputGroup label="任职时间" value={exp.date} onChange={e => updateList(setExperiences, exp.id, 'date', e.target.value)} />
                      <TextAreaGroup label="经历描述 (输入流水账后点击下方按钮润色，可反复修改)" value={exp.desc} onChange={e => updateList(setExperiences, exp.id, 'desc', e.target.value)} rows={4} />
                      <button onClick={() => handleOptimizeBlock(exp.id, 'work')} disabled={exp.isOptimizing || !exp.desc.trim()} 
                        className="w-full py-3 mt-1 bg-indigo-600 hover:bg-indigo-700 text-white text-[13px] font-black rounded-xl transition-all flex items-center justify-center gap-2 shadow-[0_4px_15px_rgba(79,70,229,0.3)] disabled:opacity-50">
                        {exp.isOptimizing ? '✨ OfferGo 演算中...' : `✨ AI 一键提炼 STAR 亮点`}
                      </button>
                    </div>
                  ))}
                  <button onClick={() => handleAddItem('work')} className="w-full py-2.5 text-xs text-indigo-600 border border-indigo-200 rounded-xl hover:bg-indigo-50 font-bold transition-all">+ 添加工作经历</button>
                </div>
              </details>

              <details className="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 group">
                <summary className="font-black text-sm text-gray-800 cursor-pointer outline-none flex justify-between items-center"><div className="flex items-center gap-2"><div className="w-1.5 h-1.5 bg-gray-400 rounded-full"></div>项目经历 (可选)</div><span className="text-gray-400 group-open:rotate-180 transition-transform">▼</span></summary>
                <div className="mt-5 space-y-5">
                  {projects.map(proj => (
                    <div key={proj.id} className="p-4 bg-slate-50 border border-gray-200 rounded-2xl relative">
                      <button onClick={() => handleRemoveItem(proj.id, 'project')} className="absolute top-3 right-3 text-xs text-red-400 hover:text-red-600 font-bold">删除</button>
                      <div className="grid grid-cols-2 gap-3 mb-2">
                        <InputGroup label="项目名" value={proj.name} onChange={e => updateList(setProjects, proj.id, 'name', e.target.value)} grid />
                        <InputGroup label="角色" value={proj.role} onChange={e => updateList(setProjects, proj.id, 'role', e.target.value)} grid />
                      </div>
                      <InputGroup label="时间" value={proj.date} onChange={e => updateList(setProjects, proj.id, 'date', e.target.value)} />
                      <TextAreaGroup label="项目描述" value={proj.desc} onChange={e => updateList(setProjects, proj.id, 'desc', e.target.value)} rows={3} />
                      <button onClick={() => handleOptimizeBlock(proj.id, 'project')} disabled={proj.isOptimizing || !proj.desc.trim()} className="w-full py-3 bg-white border border-gray-300 text-gray-700 hover:bg-gray-100 text-[13px] font-black rounded-xl transition-all shadow-sm disabled:opacity-50">
                        {proj.isOptimizing ? '✨ 优化中...' : '✨ 润色项目经历'}
                      </button>
                    </div>
                  ))}
                  <button onClick={() => handleAddItem('project')} className="w-full py-2.5 text-xs text-gray-600 border border-gray-200 rounded-xl hover:bg-gray-50 font-bold transition-all">+ 添加项目经历</button>
                </div>
              </details>

              <details className="bg-white p-5 rounded-2xl shadow-sm border border-emerald-100 group" open>
                <summary className="font-black text-sm text-emerald-900 cursor-pointer outline-none flex justify-between items-center"><div className="flex items-center gap-2"><div className="w-1.5 h-1.5 bg-emerald-500 rounded-full"></div>自我总结 (全局生成)</div><span className="text-emerald-400 group-open:rotate-180 transition-transform">▼</span></summary>
                <div className="mt-5">
                  <textarea rows={4} value={selfEval.content} onChange={e => setSelfEval({...selfEval, content: e.target.value})} className="w-full px-4 py-3 border border-emerald-200 bg-emerald-50/50 rounded-xl text-sm outline-none focus:ring-2 focus:ring-emerald-200 mb-3 text-gray-800" />
                  <button onClick={handleGenerateSelfEval} disabled={selfEval.isOptimizing} className="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white text-[13px] font-black rounded-xl transition-all shadow-md disabled:opacity-50">
                    💡 读取全局经历，一键生成终极总结
                  </button>
                </div>
              </details>
            </div>
          )}

          {/* ================= 2. 模板与样式面板 ================= */}
          {activeTab === 'design' && (
            <div className="space-y-6 animate-slideUp">
              <section className="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                <div className="flex items-center gap-2 mb-5"><div className="w-1 h-4 bg-indigo-500 rounded-full"></div><h3 className="text-[15px] font-black text-gray-800">行业专属排版库</h3></div>
                <div className="grid grid-cols-2 gap-3">
                  {[
                    { id: 'modern', name: '现代双栏', tag: '通用基础', desc: '高信息密度，层次分明' },
                    { id: 'classic', name: '经典单栏', tag: '通用基础', desc: '端庄严谨，拒绝花哨' },
                    { id: 'academic', name: '学术极简', tag: '高校体制', desc: '极简素雅，经典黑白框' },
                    { id: 'elite', name: '精英商务', tag: '高级会员', desc: '高级对比色侧边栏' },
                    { id: 'creative', name: '极简创意', tag: '高级会员', desc: '专属时间轴视觉锚点' }
                  ].map(tpl => (
                    <div key={tpl.id} onClick={() => handleTemplateSelect(tpl.id)}
                      className={`cursor-pointer p-4 rounded-xl border-2 transition-all duration-200 relative ${templateType === tpl.id ? 'border-indigo-500 bg-indigo-50/50 shadow-md transform scale-[1.02]' : 'border-gray-100 bg-white hover:border-indigo-200'} ${tpl.id === 'modern' ? 'col-span-2' : ''}`}>
                      {tpl.id.match(/(elite|creative)/) && !isVip && (
                        <div className="absolute top-0 right-0 transform translate-x-2 -translate-y-2 text-xl">🔒</div>
                      )}
                      <div className="flex justify-between items-center mb-1.5">
                        <span className={`font-black text-[14px] ${templateType === tpl.id ? 'text-indigo-700' : 'text-gray-800'}`}>{tpl.name}</span>
                        <span className={`text-[9px] px-2 py-0.5 rounded-full font-bold ${tpl.id.match(/(elite|creative)/) ? 'bg-amber-100 text-amber-700 border border-amber-200' : 'bg-gray-100 text-gray-500'}`}>{tpl.tag}</span>
                      </div>
                      <p className="text-[11px] text-gray-500 mt-1 leading-relaxed">{tpl.desc}</p>
                    </div>
                  ))}
                </div>
              </section>

              <section className="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                <div className="flex items-center gap-2 mb-5"><div className="w-1 h-4 bg-blue-500 rounded-full"></div><h3 className="text-[15px] font-black text-gray-800">品牌主色调</h3></div>
                <div className="flex flex-wrap gap-3">
                  {['#4f46e5', '#0f766e', '#0369a1', '#be123c', '#b45309', '#374151', '#000000'].map(color => (
                    <button key={color} onClick={() => setThemeColor(color)} className={`w-10 h-10 rounded-xl border-2 shadow-sm transition-all duration-200 ${themeColor === color ? 'scale-110 border-gray-900 ring-4 ring-gray-100' : 'border-transparent hover:scale-105'}`} style={{ backgroundColor: color }} />
                  ))}
                </div>
              </section>

              <section className="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                <div className="flex items-center gap-2 mb-5"><div className="w-1 h-4 bg-purple-500 rounded-full"></div><h3 className="text-[15px] font-black text-gray-800">专业中文字体引擎</h3></div>
                <div className="grid grid-cols-1 gap-3">
                  <button onClick={() => setFontFamily('theme-font-sans')} className={`py-4 px-5 flex justify-between items-center rounded-xl border-2 transition-all ${fontFamily === 'theme-font-sans' ? 'border-purple-500 bg-purple-50 shadow-md' : 'border-gray-100 bg-white hover:border-purple-200'}`}><span className="font-black text-[14px] text-gray-800">现代黑体 (推荐)</span><span className="text-xs text-gray-500 font-bold">PingFang</span></button>
                  <button onClick={() => setFontFamily('theme-font-serif')} className={`py-4 px-5 flex justify-between items-center rounded-xl border-2 transition-all ${fontFamily === 'theme-font-serif' ? 'border-purple-500 bg-purple-50 shadow-md' : 'border-gray-100 bg-white hover:border-purple-200'}`}><span className="font-black text-[14px] text-gray-800" style={{ fontFamily: "'SimSun', serif" }}>优雅宋体</span><span className="text-xs text-gray-500 font-bold">SimSun</span></button>
                  <button onClick={() => setFontFamily('theme-font-kai')} className={`py-4 px-5 flex justify-between items-center rounded-xl border-2 transition-all ${fontFamily === 'theme-font-kai' ? 'border-purple-500 bg-purple-50 shadow-md' : 'border-gray-100 bg-white hover:border-purple-200'}`}><span className="font-black text-[14px] text-gray-800" style={{ fontFamily: "'KaiTi', serif" }}>稳重楷体</span><span className="text-xs text-gray-500 font-bold">KaiTi</span></button>
                </div>
              </section>
            </div>
          )}

          {/* ================= 3. JD 匹配面板 ================= */}
          {activeTab === 'match' && (
            <div className="space-y-4 animate-slideUp">
              <div className="bg-gradient-to-br from-indigo-50 to-blue-50 border border-indigo-100 p-6 rounded-2xl shadow-sm relative overflow-hidden">
                <div className="absolute -right-6 -top-6 text-[80px] opacity-10">🎯</div>
                <h3 className="text-[16px] font-black text-indigo-900 mb-3 flex items-center gap-2 relative z-10"><span>🎯</span> 目标岗位要求 (JD)</h3>
                <textarea rows={6} value={jdText} onChange={e => setJdText(e.target.value)}
                  className="w-full px-4 py-3 border border-indigo-200/50 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none resize-y bg-white/90 relative z-10 text-gray-800"
                  placeholder="在此粘贴你要投递的岗位要求（JD）。\n如果粘贴了此项，你在内容板块进行【润色经历】时，OfferGo 会自动向该岗位的痛点靠拢。" />
                <button onClick={handleJDMatch} disabled={isMatching}
                  className="w-full mt-4 py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white text-[14px] font-black rounded-xl shadow-[0_4px_15px_rgba(79,70,229,0.3)] transition-all active:scale-[0.98] disabled:opacity-70 flex justify-center items-center gap-2 relative z-10">
                  {isMatching ? '大模型火热推演中...' : '🧠 一键开启深度匹配诊断'}
                </button>
              </div>

              {matchReport && (
                <div className="bg-white p-6 rounded-2xl border border-gray-100 shadow-[0_4px_20px_-5px_rgba(0,0,0,0.05)] space-y-5 animate-slideUp">
                  <div className="flex items-center justify-between border-b border-gray-100 pb-5">
                    <div className="text-gray-800 font-black text-[15px]">岗位契合度</div>
                    <div className="flex items-baseline gap-1">
                      <span className={`text-5xl font-black ${matchReport.score >= 80 ? 'text-emerald-500' : matchReport.score >= 60 ? 'text-amber-500' : 'text-rose-500'}`}>{matchReport.score}</span>
                      <span className="text-sm font-bold text-gray-400">/ 100</span>
                    </div>
                  </div>
                  <div>
                    <div className="text-[13px] font-black text-gray-800 mb-2">💡 综合诊断</div>
                    <p className="text-[14px] text-gray-700 leading-relaxed bg-slate-50 p-4 rounded-xl border border-gray-100">{matchReport.analysis}</p>
                  </div>
                  <div className="grid grid-cols-2 gap-4">
                    <div className="bg-emerald-50/50 p-4 rounded-xl border border-emerald-100">
                      <div className="text-[12px] font-black text-emerald-700 mb-3 flex items-center gap-1">✅ 命中核心词</div>
                      <div className="flex flex-wrap gap-2">
                        {matchReport.matched_keywords.map(kw => <span key={kw} className="px-2.5 py-1 bg-white text-emerald-600 text-[11px] font-bold rounded-md shadow-sm border border-emerald-100">{kw}</span>)}
                      </div>
                    </div>
                    <div className="bg-rose-50/50 p-4 rounded-xl border border-rose-100">
                      <div className="text-[12px] font-black text-rose-600 mb-3 flex items-center gap-1">❌ 缺失致命词</div>
                      <div className="flex flex-wrap gap-2">
                        {matchReport.missing_keywords.map(kw => <span key={kw} className="px-2.5 py-1 bg-white text-rose-500 text-[11px] font-bold rounded-md shadow-sm border border-rose-100">{kw}</span>)}
                      </div>
                    </div>
                  </div>
                  <div className="pt-3">
                    <button onClick={handleRewriteEvalByJD} disabled={selfEval.isOptimizing}
                      className="w-full py-3.5 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 text-white text-[14px] font-black rounded-xl shadow-md transition-all active:scale-[0.98]">
                      {selfEval.isOptimizing ? '提取重写中...' : '✨ 让大模型根据 JD 定制【自我评价】'}
                    </button>
                  </div>
                </div>
              )}
            </div>
          )}
          
          {/* 侧边栏原生广告展示位 (招租) */}
          <div className="mt-8 mb-4">
            <div className="block w-full p-4 bg-gradient-to-r from-gray-50 to-slate-50 rounded-2xl border border-dashed border-gray-300 cursor-pointer hover:shadow-md transition-all group">
              <div className="flex items-center justify-between">
                <div className="flex flex-col">
                  <span className="text-[10px] text-gray-400 font-black mb-1 uppercase tracking-wider">🌟 独家赞助推荐</span>
                  <span className="text-sm font-black text-gray-800 group-hover:text-indigo-600 transition-colors">广告位招租</span>
                  <span className="text-[11px] font-medium text-gray-500 mt-1">海量高精准求职流量，点击联系合作</span>
                </div>
                <div className="w-9 h-9 bg-gray-100 text-gray-400 rounded-full flex items-center justify-center text-xs font-black shadow-sm border-2 border-white group-hover:bg-indigo-500 group-hover:text-white transition-transform">
                  Ad
                </div>
              </div>
            </div>
          </div>

        </div>

        {/* 底部导出 */}
        <div className="p-5 border-t border-gray-100 bg-white z-20 shadow-[0_-10px_20px_-10px_rgba(0,0,0,0.05)]">
          <button onClick={handleExportRealPDF} disabled={isExporting}
            className="w-full py-4 bg-gray-900 hover:bg-black text-white text-[15px] font-black rounded-xl shadow-[0_4px_15px_rgba(0,0,0,0.2)] transition-all active:scale-[0.98] disabled:opacity-70 flex justify-center items-center gap-2">
            {isExporting ? '引擎渲染中...' : '📥 免费导出高清 PDF'}
          </button>
        </div>
      </div>

      {/* ================= 右侧：简历实时预览区 ================= */}
      <div className="flex-1 overflow-auto bg-slate-200/60 p-4 md:p-8 custom-scrollbar relative">
        <div className="flex justify-start xl:justify-center min-w-max pb-10">
          <div id="resume-pdf-container" className="w-[794px] min-w-[794px] min-h-[1123px] bg-white shadow-[0_15px_40px_rgba(0,0,0,0.1)] transition-all duration-300 shrink-0">
            {templateType === 'classic' && renderClassicTemplate()}
            {templateType === 'modern' && renderModernTemplate()}
            {templateType === 'creative' && renderCreativeTemplate()}
            {templateType === 'academic' && renderAcademicTemplate()}
            {templateType === 'elite' && renderEliteTemplate()}
          </div>
        </div>
      </div>
    </div>
  );
}  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
